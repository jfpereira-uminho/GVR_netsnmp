###########################################################################
# snmpd.conf - GVR SNMP lab agent
#
# Agent  : 10.0.0.1 (eth0, one end of the veth pair)
# Manager: 10.0.0.2 (eth0, the other end)
###########################################################################

# Listen on UDP port 161 on every interface (lo + eth0).
agentAddress udp:161

#--------------------------------------------------------------------------
# Access control - SNMPv1 / SNMPv2c (community strings, sent in CLEAR TEXT)
#   rocommunity <community> <allowed source>  -> GET / GETNEXT / GETBULK
#   rwcommunity <community> <allowed source>  -> the above + SET
#--------------------------------------------------------------------------
rocommunity public   10.0.0.0/30
rocommunity public   127.0.0.1
rwcommunity private  10.0.0.0/30
rwcommunity private  127.0.0.1

#--------------------------------------------------------------------------
# Access control - SNMPv3 (User-based Security Model)
#   authentication: SHA, privacy (encryption): AES
#--------------------------------------------------------------------------
createUser gvrUser SHA "gvrAuthPass" AES "gvrPrivPass"
rwuser     gvrUser authpriv

#--------------------------------------------------------------------------
# SNMPv2-MIB::system group
#   sysContact, sysName and sysLocation are deliberately NOT set here:
#   if they were, snmpd would make them read-only. Left unset, they can
#   be changed with an SNMP SET.
#--------------------------------------------------------------------------
sysServices 72

#--------------------------------------------------------------------------
# Notifications (traps) sent by this agent to the manager
#   - coldStart when snmpd starts
#   - authenticationFailure when someone uses a wrong community
#--------------------------------------------------------------------------
trap2sink      10.0.0.2 public
authtrapenable 1

#--------------------------------------------------------------------------
# NET-SNMP-EXTEND-MIB: expose command output over SNMP.
# The table is indexed by the *string* "hello" -> see how a string index
# is encoded in the OID (length followed by one sub-id per character).
#--------------------------------------------------------------------------
extend hello /bin/echo "Hello from the GVR SNMP agent"

#--------------------------------------------------------------------------
# GVR-LAB-MIB (enterprises.99999) - see mibs/GVR-LAB-MIB.txt
# 'override' registers static values at an OID. Good enough for a lab;
# a real agent would implement these with a MIB module, pass or AgentX.
#--------------------------------------------------------------------------
# Scalars (instance suffix .0)
override     .1.3.6.1.4.1.99999.1.1.1.0  octet_str  "GVR SNMP lab agent"
override     .1.3.6.1.4.1.99999.1.1.2.0  octet_str  "Gestao e Virtualizacao de Redes"
override -rw .1.3.6.1.4.1.99999.1.1.3.0  octet_str  "nobody"

# gvrLabRoomTable: column OID = 1.3.6.1.4.1.99999.1.2.1.<col>, index = room
#   col 2 = gvrLabRoomName, col 3 = gvrLabRoomTemp, col 4 = gvrLabRoomStatus
override .1.3.6.1.4.1.99999.1.2.1.2.1  octet_str  "Lab 1.05"
override .1.3.6.1.4.1.99999.1.2.1.2.2  octet_str  "Server room"
override .1.3.6.1.4.1.99999.1.2.1.2.3  octet_str  "Office 2.12"
override .1.3.6.1.4.1.99999.1.2.1.3.1  integer    215
override .1.3.6.1.4.1.99999.1.2.1.3.2  integer    287
override .1.3.6.1.4.1.99999.1.2.1.3.3  integer    199
override .1.3.6.1.4.1.99999.1.2.1.4.1  integer    1
override .1.3.6.1.4.1.99999.1.2.1.4.2  integer    2
override .1.3.6.1.4.1.99999.1.2.1.4.3  integer    1
