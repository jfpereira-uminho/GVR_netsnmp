###########################################################################
# snmptrapd.conf - GVR SNMP lab manager (notification receiver)
###########################################################################

# Listen for traps/informs on UDP 162
snmpTrapdAddr udp:162

# Accept (and log) SNMPv1/v2c notifications sent with community "public"
authCommunity log public

# Accept SNMPv3 INFORMs from gvrUser (informs need no engineID config)
createUser gvrUser SHA "gvrAuthPass" AES "gvrPrivPass"
authUser log gvrUser authPriv
